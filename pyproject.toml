[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "teleprompter"
version = "0.1.0"
description = "A terminal-based teleprompter application"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.79.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
teleprompter = "teleprompter.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
