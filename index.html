<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleprompter — Glasses Simulator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #222;
        color: #fff;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      #simulator-label {
        font-size: 13px;
        color: #666;
        margin-bottom: 8px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      #glasses-frame {
        width: 576px;
        height: 288px;
        background: #000;
        border: 2px solid #444;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
      }

      #app {
        padding: 8px 12px;
        font-size: 24px;
        line-height: 1.6;
        font-weight: bold;
        width: 576px;
        height: 288px;
        overflow: hidden;
      }

      #script-text div {
        transition: color 0.2s ease;
      }

      #status {
        position: absolute;
        bottom: 4px;
        right: 8px;
        font-size: 12px;
        color: #aaa;
      }

      #controls-help {
        margin-top: 12px;
        font-size: 11px;
        color: #555;
        text-align: center;
      }

      #controls-help kbd {
        background: #333;
        padding: 1px 5px;
        border-radius: 3px;
        border: 1px solid #555;
      }
    </style>
  </head>
  <body>
    <div id="simulator-label">Glasses Simulator</div>
    <div id="glasses-frame">
      <div id="app">
        <div id="script-text"></div>
      </div>
      <div id="status"></div>
    </div>
    <div id="controls-help">
      <kbd>Space</kbd> pause/resume &nbsp;
      <kbd>R</kbd> restart &nbsp;
      <kbd>↑</kbd><kbd>↓</kbd> speed
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
