<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleprompter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
        width: 488px;
        height: 100vh;
      }

      #app {
        padding: 16px;
        font-size: 24px;
        line-height: 1.6;
        font-weight: bold;
      }

      #script-text {
        transition: transform 0.1s linear;
      }

      #status {
        position: fixed;
        bottom: 8px;
        right: 8px;
        font-size: 12px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="script-text"></div>
    </div>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
